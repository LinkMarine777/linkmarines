<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Chart Lab · Terminal 7</title>
<link rel="icon" href="/favicon-64.png">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- TEST PAGE, not linked from anywhere: the token page's chart rebuilt on KLineChart (open source, Apache-2.0, pinned below),
     looking like the live one (token line or candles on the right scale, the pair token's dashed line on its own left scale,
     volume along the bottom, CLOBr depth on the right edge) plus drag / zoom, drawing tools, indicators and a screenshot button. -->
<style>
:root{--bg:#04060f;--panel:#0a0f1f;--line:#1a2444;--dim:#5d6a8f;--txt:#c9d3ee;--blue2:#4a7aff;--green:#39ff6a;--red:#ff3355;--amber:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px}
body{display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:10px;padding:6px 16px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:1.5px;color:var(--dim)}
.top .lab{color:var(--amber);border:1px solid var(--amber);padding:1px 6px}.top a:hover{color:#fff}
.panel{background:var(--panel);display:flex;flex-direction:column;flex:1;min-height:0}
.ph{display:flex;align-items:center;flex-wrap:wrap;gap:10px;row-gap:8px;padding:12px 16px 6px}
.tkb{display:flex;align-items:center;gap:10px;min-width:0}
.tkb img{width:32px;height:32px;border-radius:50%;background:#111;flex:none}
.tkb b{font-family:'VT323';font-weight:400;font-size:26px;color:#fff;letter-spacing:1px;line-height:1}
.tkb .q{font-family:'IBM Plex Mono';font-size:12px;color:var(--dim);margin-left:3px;letter-spacing:0}
.tkb .nm{display:flex;flex-direction:column;line-height:1.1}
.tkb .nm small{font-size:9.5px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mca{display:flex;align-items:center;gap:4px;background:none;border:0;color:var(--dim);font:inherit;font-size:11px;cursor:pointer;margin-left:6px}.mca:hover{color:#fff}.mca svg{width:11px;height:11px;fill:currentColor}
.tkl{display:flex;gap:4px;margin-left:6px}.tkl:empty{display:none}
.tkl a,.tkl button{display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--line);border-radius:5px;color:var(--dim);background:#050914;cursor:pointer;padding:0;text-decoration:none}
.tkl a:hover,.tkl button:hover{color:#fff;border-color:var(--blue2)}.tkl button.ok{color:var(--green);border-color:var(--green)}.tkl svg{width:13px;height:13px;fill:currentColor}
.tkl a.sfl img{width:15px;height:15px;display:block}.tkl a.fwl{position:relative;color:var(--green)}
.fwtip{display:none;position:absolute;top:32px;left:50%;transform:translateX(-50%);width:290px;z-index:60;background:#050914;border:1px solid var(--blue2);box-shadow:0 8px 30px rgba(0,0,0,.6);padding:10px 12px;font-size:12px;line-height:1.5;color:var(--txt);text-align:left;white-space:normal}
.fwtip b{display:block;color:var(--green);font-size:11px;letter-spacing:1.5px;margin-bottom:4px}.fwtip i{display:block;font-style:normal;color:#fff;margin-top:6px}.fwtip u{display:block;text-decoration:none;color:var(--blue2);margin-top:6px}
.tkl a.fwl:hover .fwtip,.tkl a.fwl:focus .fwtip{display:block}
.pchips{display:none}.pchips:not(:empty){display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-right:6px}
.pchips span{display:flex;align-items:baseline;gap:4px;padding:5px 9px;font-size:11px;white-space:nowrap}.pchips span+span{border-left:1px solid var(--line)}
.pchips i{font-style:normal;color:var(--dim)}.pchips b{font-weight:400}.pchips .up{color:var(--green)}.pchips .dn{color:var(--red)}
.legend{display:flex;gap:16px;align-items:center;margin-left:auto;font-size:12px;white-space:nowrap}
.legend span{display:flex;align-items:center;gap:6px}.legend i{display:inline-block;width:14px;height:2px}
.legend .dq{background:repeating-linear-gradient(90deg,var(--amber) 0 4px,transparent 4px 7px)}
.legend .dep i{width:12px;background:linear-gradient(90deg,var(--green) 50%,var(--red) 50%)}
.legend .dly{font-size:9px;letter-spacing:1px;color:#ff8c3f;border:1px solid #ff8c3f;padding:0 4px}
.legend .off{opacity:.4}
.brk{flex-basis:100%;height:0}
.tabs{display:flex;gap:4px}
.tabs button{background:transparent;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:11px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:#fff;border-color:var(--blue2)}
.tabs button.on{color:#fff;border-color:var(--blue2);background:rgba(42,90,218,.2)}
.rgt{display:flex;gap:4px;margin-left:12px}
#pmBtn{color:var(--dim)}#pmBtn b{font-weight:400}#pmBtn b.on{color:#fff}#tf{margin-right:6px}#ctab button{padding:3px 10px;display:grid;place-items:center}#ctab svg{width:18px;height:18px}
.dd{position:relative}
.dd>button{display:flex;align-items:center;gap:6px}.dd>button .fx{font-style:italic;font-family:Georgia,serif;font-size:13px;color:var(--amber)}
.dd .menu{position:absolute;top:calc(100% + 4px);left:0;z-index:20;background:#070c18;border:1px solid var(--line);box-shadow:0 10px 30px #000a;min-width:200px;padding:4px;display:none}
.dd.open .menu{display:block}
.dd .menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;color:var(--txt);font:inherit;font-size:12px;padding:7px 10px;cursor:pointer;text-align:left}
.dd .menu button:hover{background:#141f36}.dd .menu button small{color:var(--dim);font-size:10px}
.dd .menu button .ck{width:14px;height:14px;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;color:transparent;flex:none}
.dd .menu button.on .ck{border-color:var(--blue2);background:rgba(42,90,218,.3);color:#fff}
.dd .menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.dd .menu.r{left:auto;right:0;min-width:210px}
#tf{display:flex;gap:4px;align-items:center}#tfMore{padding:4px 8px}
#tfMenu{min-width:150px;max-height:70vh;overflow-y:auto}#tfMenu button{font-size:12px;padding:5px 10px}
#tfMenu .star{color:var(--dim);font-size:14px;padding:0 2px}#tfMenu .star:hover{color:#fff}#tfMenu .star.fav{color:var(--amber)}
#tfMenu button.on>span:first-child{color:#fff;font-weight:600}
.dd .menu .mh{font-size:10px;letter-spacing:1.5px;color:var(--dim);padding:6px 10px 4px}
.dd .menu [data-s]{justify-content:flex-start;gap:12px}.dd .menu [data-s] svg{width:18px;height:18px;flex:none;color:var(--dim)}.dd .menu [data-s]:hover svg{color:#fff}
#shot svg,#resetBtn svg{width:17px;height:17px}#resetBtn{padding:3px 9px;display:grid;place-items:center}#shot{padding:3px 9px;display:grid;place-items:center;color:var(--amber);border-color:rgba(255,210,63,.5)}
.body{display:flex;flex:1;min-height:0;border-top:1px solid var(--line)}
.side{width:42px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
.side button{width:32px;height:32px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:var(--dim);cursor:pointer;border-radius:4px}
.side button svg{width:19px;height:19px}
.side button:hover{color:#fff;background:#141f36}.side button.on{color:#fff;border-color:var(--blue2);background:rgba(42,90,218,.2)}
.side hr{width:24px;border:0;border-top:1px solid var(--line);margin:4px 0}
.side #clr:hover{color:var(--red)}
.cw{position:relative;flex:1;min-width:0;display:flex}
#chart{flex:1;min-width:0;min-height:300px}
/* zoom / scroll / reset over the chart, like Jupiter's: shown while the pointer is on the chart (always on touch screens) */
.zbar{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);display:flex;gap:6px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:5}
.cw:hover .zbar,.zbar:focus-within{opacity:1;pointer-events:auto}
@media (pointer:coarse){.zbar{opacity:.85;pointer-events:auto}}
.zbar button{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:6px;background:rgba(26,36,68,.85);color:#c9d3ee;cursor:pointer}
.zbar button:hover{background:#2a3a66;color:#fff}.zbar button svg{width:16px;height:16px}
html.embed .top{display:none}html.embed .panel{min-height:0}
html.nohdr .tkb,html.nohdr .tkl,html.nohdr .pchips{display:none!important}html.nohdr .ph{padding-top:8px}
#fsBtn{padding:3px 9px;display:grid;place-items:center}#fsBtn svg{width:17px;height:17px}
.panel.fs{position:fixed;inset:0;z-index:50}
.cmenu{position:fixed;z-index:80;display:none;min-width:230px;background:#070c18;border:1px solid var(--line);box-shadow:0 12px 34px #000c;padding:4px;font-size:12px}
.cmenu.open{display:block}
.cmenu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--txt);font:inherit;padding:8px 10px;cursor:pointer;text-align:left}
.cmenu button:hover{background:#141f36}.cmenu button svg{width:17px;height:17px;flex:none;color:var(--dim);fill:none;stroke:currentColor}
.cmenu button .k{margin-left:auto;color:var(--dim);font-size:10.5px}.cmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#msg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#070c18;border:1px solid var(--amber);color:#fff;padding:8px 14px;display:none;z-index:9}
@media (max-width:700px){.top>span:not(.lab){display:none}.legend{margin-left:0;flex-wrap:wrap;gap:10px}.tabs button{padding:4px 8px}.side{width:36px}.side button{width:28px;height:28px}}
</style>
</head>
<body>
<div class="top"><span class="lab">CHART LAB · TEST</span><span>not live: the token page's chart, rebuilt to try new tools</span><a id="back" href="/terminal/token" style="margin-left:auto">← TOKEN PAGE</a></div>
<div class="panel">
  <div class="ph">
    <div class="tkb"><img id="tkImg" alt=""><span class="nm"><b><span id="tkSym">…</span><span class="q" id="tkQ"></span></b><small id="tkName"></small></span><button type="button" class="mca" id="mCa" title="Copy the contract address"></button></div><span class="tkl" id="tkLinks"></span>
    <div class="legend"><a class="dep" id="depLeg" target="_blank" rel="noopener" style="display:none" title="CLOBr market depth, delayed up to 1h"><span><i></i>CLOBr depth <span class="dly">delayed</span></span></a>
      <span><i style="background:var(--blue2)"></i><span id="lgB">$TOKEN</span> (right)</span><span id="lgQw" style="display:none"><i class="dq"></i><span id="lgQ"></span> (left)</span></div>
    <div class="rgt">
      <div class="tabs"><button id="fsBtn" type="button" title="Full screen (F)" aria-label="Full screen"></button></div>
      <div class="tabs"><button id="resetBtn" type="button" title="Reset the view (or double-click the chart)" aria-label="Reset the view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button></div>
      <div class="tabs dd" id="shotDd"><button id="shot" type="button" title="Chart snapshot" aria-haspopup="true" aria-expanded="false" aria-label="Screenshot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></button><div class="menu r" id="shotMenu" role="menu"><div class="mh">CHART SNAPSHOT</div><button type="button" data-s="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg><span>Download image</span></button><button type="button" data-s="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V4H4v12h4"/></svg><span>Copy image</span></button><button type="button" data-s="x"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8zm-1.1 16.2h1.7L7.4 4.7H5.6z"/></svg><span>Share on X</span></button></div></div>
    </div>
    <i class="brk"></i>
    <div class="pchips" id="pChips"></div>
    <div class="tabs" id="tf"></div>
    <div class="tabs" id="ctab"><button id="candleBtn" type="button" aria-label="Line or candles"></button></div>
    <div class="tabs dd" id="indDd"><button type="button" id="indBtn" title="Indicators" aria-label="Indicators" aria-haspopup="true" aria-expanded="false"><span class="fx">ƒx</span><span id="indN"></span>▾</button><div class="menu" id="ind" role="menu"></div></div>
    <div class="tabs" id="pmTab"><button type="button" id="pmBtn" title="Price or market cap"><b data-m="price">Price</b> / <b data-m="mcap">MC</b></button></div>
    <div class="tabs" id="dtab" style="visibility:hidden"><button id="depthBtn" class="on" type="button" title="CLOBr market depth: support (green) and resistance (red) liquidity by price">DEPTH</button></div>
  </div>
  <div class="body"><div class="side" id="draw" aria-label="Drawing tools"></div><div class="cw"><div id="chart"></div><div class="zbar" id="zbar"><button type="button" data-z="out" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><button type="button" data-z="in" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button><button type="button" data-z="left" title="Scroll back" aria-label="Scroll back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><button type="button" data-z="right" title="Scroll forward" aria-label="Scroll forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button><button type="button" data-z="reset" title="Reset the view (Alt+R)" aria-label="Reset the view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button></div></div></div>
</div>
<div id="msg"></div>
<div class="cmenu" id="ctx" role="menu"></div>

<script src="https://cdn.jsdelivr.net/npm/klinecharts@10.0.3/dist/umd/klinecharts.min.js"></script>
<script>
const MARINE='F8Sc8HoZvJcMrTY6vBsetTqGPv6XQmM2XgVAZo1sSTNK',BOT='https://war-room-bot.linkmarine777.workers.dev';
const CA=((new URLSearchParams(location.search).get('ca')||'').trim().match(/^[1-9A-HJ-NP-Za-km-z]{32,44}$/)||[MARINE])[0];
const $=id=>document.getElementById(id);
const say=(t,ms=2500)=>{const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>m.style.display='none',ms)};
// &embed=1: inside the token page's chart panel (no test banner; on phones the token page shows the badge, links and chips itself)
const EMBED=new URLSearchParams(location.search).has('embed');document.documentElement.classList.toggle('embed',EMBED);
// &hdr=0: the token page is in its phone layout and shows the badge, links and chips above its numbers (it updates this as it changes)
document.documentElement.classList.toggle('nohdr',new URLSearchParams(location.search).get('hdr')==='0');
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
$('back').href='/terminal/token?ca='+CA;
let SYM='TOKEN',Q=null;   // Q: the pair token {mint, sym}
// ---------- Ichimoku (9 / 26 / 52): conversion, base, the cloud (leading spans A and B, 26 bars ahead, shaded green / red), lagging span ----------
klinecharts.registerIndicator({
  name:'ICHIMOKU',shortName:'Ichimoku',series:'price',precision:10,calcParams:[9,26,52],shouldOhlc:false,
  figures:[{key:'tenkan',title:'Conv: ',type:'line'},{key:'kijun',title:'Base: ',type:'line'},
    {key:'spanA',title:'Span A: ',type:'line'},{key:'spanB',title:'Span B: ',type:'line'},{key:'chikou',title:'Lag: ',type:'line'}],
  calc:(d,ind)=>{const [a,b,c]=ind.calcParams,mid=(i,n)=>{if(i<n-1)return null;let h=-Infinity,l=Infinity;for(let k=i-n+1;k<=i;k++){h=Math.max(h,d[k].high);l=Math.min(l,d[k].low)}return(h+l)/2};
    const T=d.map((_,i)=>mid(i,a)),K=d.map((_,i)=>mid(i,b)),A=d.map((_,i)=>T[i]!=null&&K[i]!=null?(T[i]+K[i])/2:null),B=d.map((_,i)=>mid(i,c));
    // spans are drawn b bars ahead; kept on the indicator for the cloud past the last candle
    ind.extendData={A,B,shift:b};
    return d.map((_,i)=>({tenkan:T[i],kijun:K[i],spanA:i>=b?A[i-b]:null,spanB:i>=b?B[i-b]:null,chikou:i+b<d.length?d[i+b].close:null}))},
  draw:({ctx,chart,indicator,xAxis,yAxis})=>{
    const e=indicator.extendData;if(!e||!e.A)return false;const {A,B,shift}=e,n=A.length,vr=chart.getVisibleRange();
    const from=Math.max(0,vr.from-shift-1),to=Math.min(n-1,vr.to-shift+1);if(to<=from)return false;
    // the cloud, one quad per bar so the colour can flip where the spans cross
    for(let i=from;i<to;i++){if(A[i]==null||B[i]==null||A[i+1]==null||B[i+1]==null)continue;
      const x0=xAxis.convertToPixel(i+shift),x1=xAxis.convertToPixel(i+1+shift);
      ctx.fillStyle=A[i]>=B[i]?'rgba(57,255,106,.13)':'rgba(255,51,85,.13)';ctx.beginPath();
      ctx.moveTo(x0,yAxis.convertToPixel(A[i]));ctx.lineTo(x1,yAxis.convertToPixel(A[i+1]));ctx.lineTo(x1,yAxis.convertToPixel(B[i+1]));ctx.lineTo(x0,yAxis.convertToPixel(B[i]));ctx.closePath();ctx.fill()}
    // the spans' edges ahead of the last candle (the regular lines stop at the last candle)
    const edge=(S,col)=>{ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();let on=false;
      for(let i=Math.max(from,n-shift-1);i<=to;i++){if(S[i]==null)continue;const x=xAxis.convertToPixel(i+shift),y=yAxis.convertToPixel(S[i]);on?ctx.lineTo(x,y):ctx.moveTo(x,y);on=true}ctx.stroke()};
    edge(A,'#39ff6a');edge(B,'#ff3355');return false},
  styles:{lines:[{color:'#4a7aff',size:1},{color:'#ff8c3f',size:1},{color:'#39ff6a',size:1},{color:'#ff3355',size:1},{color:'#b48cff',size:1,style:'dashed'}]}
});

// ---------- pitchfan: from a pivot through two points, with the median and the 0.382 / 0.618 lines between them ----------
klinecharts.registerOverlay({
  name:'pitchfan',totalStep:4,needDefaultPointFigure:true,needDefaultXAxisFigure:true,needDefaultYAxisFigure:true,
  createPointFigures:({coordinates:c,bounding})=>{if(c.length<2)return[];
    const ray=(p,q,col)=>{const dx=q.x-p.x,dy=q.y-p.y;if(!dx&&!dy)return null;const k=dx>0?(bounding.width-p.x)/dx:dx<0?-p.x/dx:1e4/Math.abs(dy);
      return{type:'line',attrs:{coordinates:[p,{x:p.x+dx*k,y:p.y+dy*k}]},styles:{color:col}}};
    if(c.length===2)return[ray(c[0],c[1],'#ffd23f')].filter(Boolean);
    const [p,b,q]=c,at=f=>({x:b.x+(q.x-b.x)*f,y:b.y+(q.y-b.y)*f});
    return[{type:'line',attrs:{coordinates:[b,q]},styles:{color:'#5d6a8f',style:'dashed'}},
      ...[[0,'#ffd23f'],[.382,'#4a7aff'],[.5,'#39ff6a'],[.618,'#4a7aff'],[1,'#ffd23f']].map(([f,col])=>ray(p,at(f),col)).filter(Boolean)]}
});

// ---------- the pair token's line (e.g. $LINK): dashed amber on its own scale on the left, like the live chart ----------
let QMAP=new Map();   // candle time -> the pair token's close
klinecharts.registerIndicator({name:'QUOTE',shortName:'',series:'normal',precision:4,
  figures:[{key:'q',title:'',type:'line'}],
  // in MC the chart rounds to whole numbers (market caps), so the pair token's price is carried scaled up (QS) and its labels and
  // hover value scaled back down; in Price QS is 1
  calc:d=>{let last=null;return d.map(k=>{const v=QMAP.get(k.timestamp);if(v!=null)last=v;const q=v??last;return{q:q==null?q:q*QS()}})},
  createTooltipDataSource:({indicator,crosshair})=>{const r=(indicator.result||[])[crosshair.dataIndex],v=r&&r.q!=null?r.q/QS():null;
    return{name:'',calcParamsText:'',features:[],legends:v==null?[]:[{title:{text:indicator.shortName+'  ',color:'#5d6a8f'},value:{text:'$'+fmtQ(v),color:'#ffd23f'}}]}},
  styles:{lines:[{color:'rgba(255,210,63,.8)',size:1.25,style:'dashed',dashedValue:[4,3]}]}});
const QS=()=>MODE==='mcap'?1e8:1;
const fmtQ=v=>v>=1000?v.toFixed(0):v>=1?v.toFixed(2):+v>=.01?v.toFixed(4):(+v).toPrecision(3);
// Price or MC (market cap), like Jupiter's toggle: Jupiter's own market-cap candles; kept per browser

// ---------- volume along the bottom of the chart (blue up, grey down), like the live chart; drawn by the depth layer below
// (an indicator of its own threw the price scale off on narrow screens) ----------
function drawVol({ctx,chart,bounding,xAxis}){const L=chart.getDataList(),vr=chart.getVisibleRange(),from=Math.max(0,vr.from),to=Math.min(L.length,vr.to);
    let mx=0;for(let i=from;i<to;i++)mx=Math.max(mx,L[i].volume||0);if(!mx)return;
    const vh=bounding.height*.18,yb=bounding.height,w=Math.max(1,chart.getBarSpace().gapBar||chart.getBarSpace().bar*.8||3);
    for(let i=from;i<to;i++){const k=L[i],h=(k.volume||0)/mx*vh;if(h<.5)continue;ctx.fillStyle=k.close>=k.open?'rgba(74,122,255,.4)':'rgba(232,238,255,.28)';
      ctx.fillRect(xAxis.convertToPixel(i)-w/2,yb-h,w,h)}}

// ---------- CLOBr depth on the right edge: liquidity per price band on the token's scale, green support / red resistance ----------

klinecharts.registerIndicator({name:'DEPTHB',shortName:'',series:'price',precision:12,figures:[{key:'c',title:''}],calc:d=>d.map(k=>({c:k.close})),
  createTooltipDataSource:()=>({name:'',calcParamsText:'',features:[],legends:[]}),
  draw:args=>{drawVol(args);const {ctx,bounding,yAxis}=args;if(!depthOn||!DEPTH)return true;const h=bounding.height,w=bounding.width,rows=Math.max(12,Math.min(140,Math.floor(h/5))),bh=h/rows;
    const bins=Array.from({length:rows},()=>[0,0]);
    DEPTH.forEach(([p,su,re])=>{const y=yAxis.convertToPixel(MODE==='mcap'?(SUPPLY?p*SUPPLY:NaN):p);if(y<0||y>h)return;const i=Math.min(rows-1,Math.max(0,Math.floor((h-y)/bh)));bins[i][0]+=su;bins[i][1]+=re});
    const mx=Math.max(...bins.map(b=>b[0]+b[1]));if(!(mx>0))return true;const maxW=w*.26;
    bins.forEach(([su,re],i)=>{const v=su+re;if(!v)return;const bw=Math.max(2,v/mx*maxW),y=h-(i+1)*bh+1,bhh=Math.max(1,bh-2),sup=su>=re;
      ctx.fillStyle=sup?'rgba(57,255,106,.16)':'rgba(255,51,85,.16)';ctx.fillRect(w-bw,y,bw,bhh);
      ctx.fillStyle=sup?'rgba(57,255,106,.75)':'rgba(255,51,85,.75)';ctx.fillRect(w-bw,y,2,bhh)});return true}});

// ---------- chart snapshot: the chart with the token, timeframe, time and the terminal7.xyz link on it; download, copy, or share on X ----------

  const pad=44,c=document.createElement('canvas');c.width=img.width;c.height=img.height+pad*2;const x=c.getContext('2d');
  x.fillStyle='#04060f';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,pad);
  x.fillStyle='#fff';x.font='28px VT323, monospace';x.textBaseline='middle';x.fillText('$'+SYM+(MODE==='mcap'?' MC':'')+(Q?' / $'+Q.sym:'')+' · '+TF[1],14,pad/2);
  x.font='12px "IBM Plex Mono", monospace';x.fillStyle='#5d6a8f';x.textAlign='right';x.fillText(new Date().toUTCString().replace(' GMT',' UTC'),c.width-14,pad/2);
  x.textAlign='left';x.fillStyle='#ffd23f';x.font='600 15px "IBM Plex Mono", monospace';x.fillText('terminal7.xyz',14,img.height+pad*1.5);
  x.fillStyle='#5d6a8f';x.font='12px "IBM Plex Mono", monospace';x.textAlign='right';x.fillText(LINK.replace('https://',''),c.width-14,img.height+pad*1.5);
  return new Promise(r=>c.toBlob(r,'image/png'))}
const fname=()=>`${SYM}-${TF[1]}-terminal7.png`;
const copyImg=async b=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);return true}catch(e){return false}};
const shotOpen=o=>{$('shotDd').classList.toggle('open',o);$('shot').setAttribute('aria-expanded',o)};

async function doShot(kind){const b={dataset:{s:kind}},blob=await snapshot();if(!blob)return say('Couldn\'t make the image');
  if(b.dataset.s==='save'){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname();a.click();return say('Image saved')}
  if(b.dataset.s==='copy')return say(await copyImg(blob)?'Image copied':'Your browser blocked copying: use Download image');
  // Share on X: phones hand the image to the X app through the share sheet; elsewhere the image is copied and X opens with
  // the text and the chart link, ready for the image to be pasted in (X's post links can't carry an image themselves)
  const text=`$${SYM}${Q?' / $'+Q.sym:''} on Terminal 7 📈`,file=new File([blob],fname(),{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer:coarse)').matches){try{await navigator.share({files:[file],text:text+' '+LINK});return}catch(err){if(err.name==='AbortError')return}}
  const copied=await copyImg(blob);
  open('https://x.com/intent/post?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(LINK),'_blank','noopener');
  say(copied?'Image copied: paste it into your post (Ctrl/Cmd+V)':'Download the image to add it to your post',5000)};

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(n,d=0)=>n==null?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const ICO={x:'<path d="M18.9 2H22l-7.6 8.7L23 22h-6.8l-5.3-6.9L4.8 22H1.7l8.1-9.3L1 2h7l4.8 6.3zm-1.2 18h1.9L7.4 4H5.4z"/>',
  web:'<path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.9 6h-2.9a15.7 15.7 0 00-1.4-3.6A8 8 0 0118.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8 8 0 010-4h3.4a16.6 16.6 0 000 4zm.8 2h2.9c.3 1.3.8 2.5 1.4 3.6A8 8 0 015.1 16zM8 8H5.1a8 8 0 014.3-3.6C8.8 5.5 8.4 6.7 8 8zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 010-4h4.6a14.7 14.7 0 010 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h2.9a8 8 0 01-4.3 3.6zm1.7-5.6a16.6 16.6 0 000-4h3.4a8 8 0 010 4z"/>',
  tg:'<path d="M21.9 4.3l-3.3 15.5c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L5.9 13.3l-4.9-1.5c-1.1-.3-1.1-1.1.2-1.6L20.5 2.8c.9-.3 1.7.2 1.4 1.5z"/>',
  copy:'<path d="M8 3h11a2 2 0 012 2v11h-2V5H8zM4 7h11a2 2 0 012 2v11a2 2 0 01-2 2H4a2 2 0 01-2-2V9a2 2 0 012-2zm0 2v11h11V9z"/>',ok:'<path d="M9 16.2l-3.5-3.5L4 14.2l5 5 11-11-1.4-1.4z"/>',
  fw:'<path d="M12 4a8 8 0 017.4 5H17l3.5 4 3.5-4h-2.4A10 10 0 002.3 9.5l1.9.6A8 8 0 0112 4zm-8.5 7L0 15h2.4a10 10 0 0019.3 1.5l-1.9-.6A8 8 0 014.6 15H7z"/>',
  search:'<path d="M10 2a8 8 0 016.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1110 2zm0 2a6 6 0 100 12 6 6 0 000-12z"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${ICO[k]}</svg>`;
async function copyCa(b,ico){try{await navigator.clipboard.writeText(CA)}catch(e){}b.classList.add('ok');const h=b.innerHTML;b.innerHTML=ico?svg('ok'):'copied '+svg('ok');setTimeout(()=>{b.classList.remove('ok');b.innerHTML=h},1400)}
$('mCa').innerHTML=esc(CA.slice(0,4)+'…'+CA.slice(-4))+' '+svg('copy');$('mCa').onclick=()=>copyCa($('mCa'));
// the token as the token page sees it: stonkfun's record (the bot's /token: name, logo, quote token, tax, flywheel), DexScreener for
// the pool, the socials and the 5m / 1h / 6h / 24h changes; Jupiter for anything stonkfun doesn't have
const sfInfo=fetch(BOT+'/token/'+CA).then(r=>r.json()).then(t=>t&&!t.error?t:null).catch(()=>null);
const dsInfo=fetch('https://api.dexscreener.com/latest/dex/tokens/'+CA).then(r=>r.json()).then(d=>(d.pairs||[]).filter(p=>p.chainId==='solana')).catch(()=>[]);
const jupInfo=fetch('https://lite-api.jup.ag/tokens/v2/search?query='+CA).then(r=>r.json()).then(L=>(L||[]).find(t=>t.id===CA)||null).catch(()=>null);
Promise.all([sfInfo,dsInfo,jupInfo]).then(([sf,pairs,jt])=>{
  const liq=p=>((p.liquidity||{}).usd||0),other=p=>p.baseToken.address===CA?p.quoteToken:p.baseToken;
  const qm=sf&&sf.quote&&sf.quote.mint,P=(qm&&pairs.filter(p=>other(p).address===qm).sort((a,b)=>liq(b)-liq(a))[0])||pairs.sort((a,b)=>liq(b)-liq(a))[0]||null;
  const me=P?(P.baseToken.address===CA?P.baseToken:P.quoteToken):{};
  SYM=String((sf&&sf.symbol)||(jt&&jt.symbol)||me.symbol||'TOKEN').replace(/^\$/,'');
  const name=(sf&&sf.name)||(jt&&jt.name)||me.name||'',img=CA===MARINE?'/terminal/img/marine.webp':pairs.map(p=>p.info&&p.info.imageUrl).find(Boolean)||(sf&&sf.image)||(jt&&jt.icon)||'';   // DexScreener's: the project's current logo
  if(img)$('tkImg').src=img;$('tkSym').textContent='$'+SYM;$('lgB').textContent='$'+SYM+(MODE==='mcap'?' MC':'');document.title='$'+SYM+' · Chart Lab';
  $('tkName').textContent=name&&name.replace(/^\$/,'').toLowerCase()!==SYM.toLowerCase()?name:'';
  const q=qm?{mint:qm,sym:String(sf.quote.symbol||'').replace(/^\$/,'')}:P?{mint:other(P).address,sym:String(other(P).symbol||'').replace(/^\$/,'')}:null;
  if(q&&q.mint){Q=q;chart.createIndicator({name:'QUOTE',shortName:'$'+q.sym,paneId:'candle_pane',yAxisId:'quote_axis'},true);$('tkQ').textContent='/$'+q.sym;$('lgQ').textContent='$'+q.sym;$('lgQw').style.display=''}
  // the links, in the token page's order: stonkfun, the flywheel, X, website, Telegram, an X search for the cashtag, copy
  const info=pairs.map(p=>p.info).find(i=>i&&((i.socials||[]).length||(i.websites||[]).length))||{},safe=u=>/^https?:\/\//i.test(u||'')?u:null,
    soc=t=>safe(((info.socials||[]).find(x=>x.type===t)||{}).url),L=[],a=(href,ico,title)=>href&&L.push(`<a href="${esc(href)}" target="_blank" rel="noopener" title="${esc(title)}" aria-label="${esc(title)}">${svg(ico)}</a>`);
  if(sf){L.push(`<a class="sfl" href="https://www.stonkfun.xyz/token/${esc(CA)}" target="_blank" rel="noopener" title="$${esc(SYM)} on stonkfun" aria-label="$${esc(SYM)} on stonkfun"><img src="/terminal/img/stonkfun.png" alt=""></a>`);
    const r=sf.rewards||{},tax=sf.transferTaxBps!=null?+(sf.transferTaxBps/100).toFixed(1)+'%':'a';
    if(r.minDistributionUsd||r.minHoldingUsd)L.push(`<a class="fwl" href="/flywheel/" aria-label="How the $${esc(SYM)} flywheel works">${svg('fw')}<span class="fwtip"><b>THE FLYWHEEL</b>Every $${esc(SYM)} buy and sell pays ${esc(tax)} tax. It's swapped into $${esc(Q?Q.sym:'')} and pooled; when the pot hits $${num(r.minDistributionUsd||0)}, it's airdropped to every wallet holding $${num(r.minHoldingUsd||0)}+ of $${esc(SYM)}. No claiming.<u>Click for how it works ▸</u></span></a>`)}
  a(soc('twitter'),'x','$'+SYM+' on X');a(safe((info.websites||[])[0]&&info.websites[0].url),'web','$'+SYM+' website');a(soc('telegram'),'tg','$'+SYM+' Telegram');
  if(/^[A-Za-z0-9_]{1,15}$/.test(SYM))a('https://x.com/search?q='+encodeURIComponent('$'+SYM)+'&f=live','search','Search $'+SYM+' on X');
  L.push(`<button type="button" id="copyCa" title="Copy $${esc(SYM)} contract address" aria-label="Copy contract address">${svg('copy')}</button>`);
  $('tkLinks').innerHTML=L.join('');$('copyCa').onclick=()=>copyCa($('copyCa'),1);
  // the change chips: DexScreener's, for a pool where the token is the base (a pool listed the other way round describes the other token)
  const pc=P&&P.baseToken.address===CA?(P.priceChange||{}):null;if(pc&&pc.m5==null&&pc.h1!=null)pc.m5=0;
  $('pChips').innerHTML=pc?[['m5','5m'],['h1','1h'],['h6','6h'],['h24','24h']].map(([k,l])=>pc[k]==null?'':`<span><i>${l}</i><b class="${pc[k]>=0?'up':'dn'}">${pc[k]>=0?'':'−'}${Math.abs(pc[k]).toFixed(2)}%</b></span>`).join(''):'';
  PPREC=prec(jt&&+jt.usdPrice||+(P&&P.priceUsd)||0)||8;SUPPLY=jt&&+jt.circSupply||(jt&&+jt.mcap&&+jt.usdPrice?jt.mcap/jt.usdPrice:null);
  chart.setSymbol({ticker:SYM,pricePrecision:MODE==='mcap'?0:PPREC,volumePrecision:0});chart.setPeriod(TF[3])});
fetch(BOT+'/depth?mint='+CA+'&d=1').then(r=>r.json()).then(d=>{if(!d||!d.levels||!d.levels.length)return;DEPTH=d.levels;
  $('dtab').style.visibility='';const l=$('depLeg');l.style.display='';l.href='https://clobr.io/token/'+encodeURIComponent(CA);l.classList.toggle('off',!depthOn);chart.resize()}).catch(()=>{});
addEventListener('resize',()=>chart.resize());
function pmShow(){chart.setStyles({crosshair:{horizontal:{text:{show:MODE!=='mcap'}}}});document.querySelectorAll('#pmBtn b').forEach(b=>b.classList.toggle('on',b.dataset.m===MODE));$('lgB').textContent='$'+SYM+(MODE==='mcap'?' MC':'')}
$('pmBtn').onclick=()=>{MODE=MODE==='mcap'?'price':'mcap';store('wrLabMode',MODE);pmShow();
  // this mode's drawings, and the candles again (setting the symbol reloads them)
  saveDraw.off=1;chart.removeOverlay();SEL=null;DKEY='wrLabDraw:'+CA+(MODE==='mcap'?':mc':'');restoreDraw.done=0;
  chart.setSymbol({ticker:SYM+(MODE==='mcap'?' ':''),pricePrecision:MODE==='mcap'?0:PPREC,volumePrecision:0})};
pmShow();

// ---------- full screen: the browser's own where it has one (Esc leaves), else the chart fills the window ----------
const FS_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  FS_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const panel=document.querySelector('.panel'),isFs=()=>!!document.fullscreenElement||panel.classList.contains('fs');
const fsIcon=()=>{$('fsBtn').innerHTML=isFs()?FS_OFF:FS_ON;$('fsBtn').title=isFs()?'Exit full screen (Esc)':'Full screen (F)';setTimeout(()=>chart.resize(),60)};
function toggleFs(){if(isFs()){if(document.fullscreenElement)document.exitFullscreen();else panel.classList.remove('fs');return fsIcon()}
  if(panel.requestFullscreen)panel.requestFullscreen().catch(()=>{panel.classList.add('fs');fsIcon()});else panel.classList.add('fs');fsIcon()}
$('fsBtn').onclick=toggleFs;document.addEventListener('fullscreenchange',fsIcon);fsIcon();

// ---------- right-click (or long-press) on the chart: reset, copy the price there, snapshot, clear ----------
const CI={reset:'<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V4H4v12h4"/>',
  save:'<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>',x:'<path d="M4 4l16 16M20 4L4 20"/>',share:'<path d="M4 12v7h16v-7M12 3v12M8 7l4-4 4 4"/>',
  draw:'<path d="M6 18L18 6"/><circle cx="5" cy="19" r="1.8"/><circle cx="19" cy="5" r="1.8"/>',ind:'<path d="M3 17l5-6 4 3 4-7 5 5"/>'};
const ci=k=>`<svg viewBox="0 0 24 24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${CI[k]}</svg>`;
let ctxPrice=null;
$('chart').addEventListener('contextmenu',e=>{e.preventDefault();
  const main=chart.getDom('candle_pane','main'),r=main&&main.getBoundingClientRect();ctxPrice=null;
  if(r&&e.clientY>=r.top&&e.clientY<=r.bottom){const pt=chart.convertFromPixel([{x:e.clientX-r.left,y:e.clientY-r.top}],{paneId:'candle_pane'});ctxPrice=(Array.isArray(pt)?pt[0]:pt).value}
  const m=$('ctx');m.innerHTML=`<button data-c="reset">${ci('reset')}Reset chart view<span class="k">Alt+R</span></button>`
    +(ctxPrice>0?`<button data-c="price">${ci('copy')}Copy ${MODE==='mcap'?'MC':'price'} $${fmtV(ctxPrice)}</button>`:'')+'<hr>'
    +`<button data-c="save">${ci('save')}Download image</button><button data-c="copyimg">${ci('copy')}Copy image</button><button data-c="x">${ci('share')}Share on X</button><hr>`
    +`<button data-c="draw">${ci('draw')}Remove drawings</button><button data-c="ind">${ci('ind')}Remove indicators</button>`;
  m.classList.add('open');const w=m.offsetWidth,h=m.offsetHeight;m.style.left=Math.min(e.clientX,innerWidth-w-6)+'px';m.style.top=Math.min(e.clientY,innerHeight-h-6)+'px'});
$('ctx').onclick=async e=>{const b=e.target.closest('[data-c]');if(!b)return;$('ctx').classList.remove('open');const c=b.dataset.c;
  if(c==='reset')resetView();
  else if(c==='price'){try{await navigator.clipboard.writeText(fmtV(ctxPrice))}catch(err){}say('Copied $'+fmtV(ctxPrice),1500)}
  else if(c==='draw')$('clr').click();
  else if(c==='ind')Object.keys(live).forEach(toggleInd);
  else doShot(c==='copyimg'?'copy':c)};
document.addEventListener('click',e=>{if(!e.target.closest('#ctx'))$('ctx').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('ctx').classList.remove('open');
  if(e.target.closest('input,textarea'))return;
  if(e.altKey&&e.code==='KeyR'){e.preventDefault();resetView()}
  else if(!e.altKey&&!e.ctrlKey&&!e.metaKey&&e.code==='KeyF')toggleFs()});
</script>

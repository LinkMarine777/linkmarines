# Whale radar (and the $MARINE chart, chart.json): a full pass every 30 min, then fast passes every ~2 min in between, read what the top holders of $MARINE and stonkfun's top 10 bought and sold, and write
# terminal/whales.json to the data branch (Vercel doesn't deploy that branch; the terminals read the file from GitHub).
# Free: public repo Actions minutes, Solana RPC (Helius when the SOLANA_RPC or HELIUS_KEY repository secret is set), Jupiter.
name: whale radar
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whales
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
          sparse-checkout: intel
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: scan whales
        env:
          HELIUS_KEY: ${{ secrets.HELIUS_KEY }}
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
        run: python3 main/intel/whales.py data/terminal
      - name: save to the data branch
        working-directory: data
        run: bash ../main/intel/push-data.sh "whale radar"
      # then, until the next full run, a fast pass every ~2 min (no RPC): big trades, CLOBr scores, the board and the
      # stream's alerts reach the bot within minutes instead of in one batch every 30 min. Free on a public repo.
      - name: fast passes until the next run
        env:
          FAST: '1'
        run: |
          end=$(( $(date +%s) + 22 * 60 ))
          while [ $(date +%s) -lt $end ]; do
            sleep 30
            python3 main/intel/whales.py data/terminal || echo "fast pass failed"
            (cd data && bash ../main/intel/push-data.sh "whale radar (fast)") || echo "save failed"
          done

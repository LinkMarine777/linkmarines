# One-off test of the compounding score: reads the top 20 holders of $MARINE (since launch) and $ZCAT (last 7 days),
# only their token account and reward-token account, with the Helius key, then prints the score tables.
# Runs only on pushes to this test branch.
name: compound test
on:
  push:
    branches: [claude/youthful-ramanujan-wa515v]
    paths: ['intel/compound/**', '.github/workflows/compound-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
          sparse-checkout: terminal
      - name: pull holder history
        working-directory: intel/compound
        env:
          HELIUS_KEY: ${{ secrets.HELIUS_KEY }}
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
        run: |
          python3 fetch.py F8Sc8HoZvJcMrTY6vBsetTqGPv6XQmM2XgVAZo1sSTNK LinkhB3afbBKb2EQQu7s7umdZceV3wcvAUJhQAfQ23L 1789329000 marine.json ../../data/terminal/whales-state.json
          python3 fetch.py HcRLc9VDgjLeK154xDawfb1dmVJ98DoSqcwTHGqiDeJR A7bdiYdS5GjqGFtxf17ppRHtDKPkkRqbKtR27dxvQXaS $(( $(date +%s) - 7 * 86400 )) zcat.json ../../data/terminal/whales-state.json
      - name: scores
        working-directory: intel/compound
        run: |
          echo "=== MARINE (since launch) ==="
          python3 score.py F8Sc8HoZvJcMrTY6vBsetTqGPv6XQmM2XgVAZo1sSTNK LinkhB3afbBKb2EQQu7s7umdZceV3wcvAUJhQAfQ23L marine.json 1000000000 1789329000 MARINE LINK
          echo "=== ZCAT (last 7 days) ==="
          python3 score.py HcRLc9VDgjLeK154xDawfb1dmVJ98DoSqcwTHGqiDeJR A7bdiYdS5GjqGFtxf17ppRHtDKPkkRqbKtR27dxvQXaS zcat.json 967490154 $(( $(date +%s) - 7 * 86400 )) ZCAT ZEC
      - uses: actions/upload-artifact@v4
        with:
          name: compound-test
          path: intel/compound/*.json

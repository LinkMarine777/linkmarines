# Launch radar (intel/launches.py): a REAL / WATCH / THIN / FARM score and a bundle scan for every stonkfun launch of the
# last 24 h, stonkfun coins in Jupiter VRFD, Sunrise's next pairs, new stonkfun pairs. A pass every ~5 min, written to
# terminal/launches.json on the data branch (the /launches page reads it, the whale radar folds its alerts in).
# Free: stonkfun's public API, Jupiter's data API and VRFD's public request list. No RPC.
name: launch radar
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write   # the bot's /ingest checks GitHub's signed token for this job (intel/push-data.sh)
concurrency:
  group: launches
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
          sparse-checkout: intel
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: a pass every ~5 min until the next run
        env:
          FILES: terminal/launches.json terminal/launches-state.json
        run: |
          end=$(( $(date +%s) + 27 * 60 ))
          while [ $(date +%s) -lt $end ]; do
            start=$(date +%s)
            python3 main/intel/launches.py data/terminal || echo "pass failed"
            (cd data && bash ../main/intel/push-data.sh "launch radar") || echo "save failed"
            left=$(( 300 - ($(date +%s) - start) )); if [ $(( $(date +%s) + left )) -ge $end ]; then break; fi   # no room for another pass before the next run
            if [ $left -gt 0 ]; then sleep $left; fi
          done
